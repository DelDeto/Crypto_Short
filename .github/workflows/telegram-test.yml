name: Telegram Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test existing Telegram bot and group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          token = os.getenv("TELEGRAM_BOT_TOKEN") or ""
          personal = os.getenv("TELEGRAM_CHAT_ID") or ""
          group = "-1003984243045"

          if not token:
              print("MISSING_TELEGRAM_BOT_TOKEN")
              sys.exit(2)

          destinations = []
          for chat_id in (personal, group):
              if chat_id and chat_id not in destinations:
                  destinations.append(chat_id)

          text = (
              "🔻 CRYPTO SHORT SCANNER\n"
              "Telegram connection: ✅ ONLINE\n"
              "Repo: DelDeto/Crypto_Short\n"
              "Short signals will be sent to this destination."
          )

          for chat_id in destinations:
              payload = json.dumps({
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": True,
              }).encode()
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(chat_id, response.status)
          PY
