name: Crypto Short V2.2.1 Validation

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical replay days"
        required: true
        default: "180"
      symbol_limit:
        description: "Current liquid symbols to replay (0 = all)"
        required: true
        default: "150"
      horizon_hours:
        description: "Hours allowed for +2R / -1R / terminal exit"
        required: true
        default: "72"
      fee_bps:
        description: "Round-trip fee assumption in bps"
        required: true
        default: "8"
      slippage_bps:
        description: "Round-trip slippage assumption in bps"
        required: true
        default: "6"
      v22_entry_score:
        description: "V2.2 ENTRY_READY score threshold"
        required: true
        default: "70"
      max_concurrent:
        description: "Max concurrent ranked V2.2 positions"
        required: true
        default: "3"
      portfolio_risk_pct:
        description: "Portfolio risk percent per ranked trade"
        required: true
        default: "0.5"
  push:
    branches: [main]
    paths:
      - "short_algo/backtest.py"
      - "short_algo/calibration_v2.py"
      - "short_algo/models.py"
      - "short_algo/v21.py"
      - "short_algo/v22.py"
      - "short_algo/v22_portfolio.py"
      - "short_algo/baselines.py"
      - "short_algo/v2_main.py"
      - "short_algo/v2_merge.py"
      - "short_algo/mexc.py"
      - "short_algo/config.py"
      - ".github/workflows/v2-backtest.yml"

permissions:
  contents: read

concurrency:
  group: crypto-short-v2-backtest
  cancel-in-progress: false

jobs:
  backtest:
    name: backtest-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUNBUFFERED: "1"
      BACKTEST_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '180' }}
      BACKTEST_SYMBOL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.symbol_limit || '150' }}
      BACKTEST_HORIZON_HOURS: ${{ github.event_name == 'workflow_dispatch' && inputs.horizon_hours || '72' }}
      BACKTEST_FEE_BPS_ROUND_TRIP: ${{ github.event_name == 'workflow_dispatch' && inputs.fee_bps || '8' }}
      BACKTEST_SLIPPAGE_BPS_ROUND_TRIP: ${{ github.event_name == 'workflow_dispatch' && inputs.slippage_bps || '6' }}
      V22_ENTRY_SCORE: ${{ github.event_name == 'workflow_dispatch' && inputs.v22_entry_score || '70' }}
      V22_MAX_CONCURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.max_concurrent || '3' }}
      V22_PORTFOLIO_RISK_PCT: ${{ github.event_name == 'workflow_dispatch' && inputs.portfolio_risk_pct || '0.5' }}
      BACKTEST_SHARD_INDEX: ${{ matrix.shard }}
      BACKTEST_SHARD_COUNT: "8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile V2.2.1
        run: python -m compileall -q short_algo

      - name: Run V2.2.1 historical replay shard
        run: python -m short_algo.v2_main

      - name: Upload shard research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Short-V221-Shard-${{ matrix.shard }}
          path: |
            output/v2_backtest.json
            output/v2_trades.csv
            output/v2_calibration.json
            output/v2_summary.md
          if-no-files-found: warn
          retention-days: 14

  merge:
    name: merge-v221-results
    needs: backtest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: Crypto-Short-V221-Shard-*
          path: shard_outputs

      - name: Merge and recalculate V2.2.1 metrics
        run: python -m short_algo.v2_merge shard_outputs

      - name: Publish summary
        run: cat output/v2_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final V2.2.1 validation
        uses: actions/upload-artifact@v4
        with:
          name: Crypto-Short-V221-Validation-Final
          path: |
            output/v2_backtest.json
            output/v2_trades.csv
            output/v2_calibration.json
            output/v2_summary.md
          if-no-files-found: error
          retention-days: 30
