name: Crypto Short V4.4.15 M2 Regime Study

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "short_algo/v4415_m2_regime_study.py"
      - ".github/workflows/v4415-m2-regime-study.yml"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: analyze-v4415-m2-regime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: Crypto-Short-V4414-M2-Watch-Gate-360D-Final
          path: artifact
          run-id: 37875296221
          github-token: ${{ github.token }}
      - name: Study pre-entry regime features
        run: python -m short_algo.v4415_m2_regime_study artifact/v4414_m2_backtest.json output
      - run: cat output/v4415_m2_regime_study.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Crypto-Short-V4415-M2-Regime-Study
          path: |
            output/v4415_m2_regime_study.json
            output/v4415_m2_regime_study.md
          if-no-files-found: error
          retention-days: 14
