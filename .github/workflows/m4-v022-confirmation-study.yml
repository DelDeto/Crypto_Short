name: Crypto Short M4 V0.2.2 Confirmation Study (Research Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "m4_confirmation/**"
      - ".github/workflows/m4-v022-confirmation-study.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: m4-v022-failed-breakout-confirmation
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pin and download original frozen V0.2 research data
        uses: actions/download-artifact@v4
        with:
          run-id: 38206513291
          repository: DelDeto/Crypto_Short
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: M4-V02-Event-Study-Final
          path: frozen/v02
      - name: Offline causal confirmation tests
        run: |
          python -m compileall -q m4_confirmation
          python -m m4_confirmation.selftest
      - name: Freeze 893 H1 events and original controls
        run: python -m m4_confirmation.prepare
      - uses: actions/upload-artifact@v4
        with:
          name: M4-V022-Prepare
          path: output/m4_v022/manifest.json
          if-no-files-found: error
          retention-days: 45

  replay:
    needs: prepare
    name: m4-v022-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 145
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      PYTHONUNBUFFERED: "1"
      M4_MEXC_BASE_URL: https://api.mexc.com
      M4_V022_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download original frozen V0.2 source data
        uses: actions/download-artifact@v4
        with:
          run-id: 38206513291
          repository: DelDeto/Crypto_Short
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: M4-V02-Event-Study-Final
          path: frozen/v02
      - uses: actions/download-artifact@v4
        with:
          name: M4-V022-Prepare
          path: frozen/v022
      - name: Re-evaluate H2 and rebased controls (no orders)
        run: python -m m4_confirmation.shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M4-V022-Shard-${{ matrix.shard }}
          path: output/m4_v022/shard.json
          if-no-files-found: warn
          retention-days: 21

  merge:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download original frozen V0.2 data
        uses: actions/download-artifact@v4
        with:
          run-id: 38206513291
          repository: DelDeto/Crypto_Short
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: M4-V02-Event-Study-Final
          path: frozen/v02
      - uses: actions/download-artifact@v4
        with:
          name: M4-V022-Prepare
          path: frozen/v022
      - uses: actions/download-artifact@v4
        with:
          pattern: M4-V022-Shard-*
          path: m4v022_shards
      - name: Audit outcomes at confirmed entry and compare frozen controls
        run: python -m m4_confirmation.merge
      - if: always()
        run: |
          if [ -f output/m4_v022/m4_v022_summary.md ]; then
            cat output/m4_v022/m4_v022_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M4-V022-Confirmation-Study-Final
          path: |
            output/m4_v022/m4_v022_analysis.json
            output/m4_v022/m4_v022_summary.md
            output/m4_v022/m4_v022_cases.csv
            output/m4_v022/m4_v022_matched_rebased.csv
            output/m4_v022/m4_v022_unmatched.csv
            output/m4_v022/m4_v022_control_coverage.csv
            frozen/v022/manifest.json
          if-no-files-found: warn
          retention-days: 45
