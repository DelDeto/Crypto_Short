name: M5 V0.4.1 Historical Entry Robustness (Research Only)

on:
  push:
    branches: [main, m5-v041-entry-robustness]
    paths:
      - ".github/workflows/m5-v041-robustness.yml"
      - "m5_research/v041_robustness.py"
      - "m5_research/v041_selftest.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m5-v041-report-writer
  cancel-in-progress: false

jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test causal entry timing, same-bar SL, cost stress and source checks
        run: |
          python -m compileall -q m5_research
          python -m m5_research.selftest
          python -m m5_research.v02_selftest
          python -m m5_research.v03_selftest
          python -m m5_research.v031_selftest
          python -m m5_research.v04_selftest
          python -m m5_research.v041_selftest

  robustness_report:
    needs: [offline_tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Audit existing M5 V0.4 OHLC without API or trading
        shell: bash
        run: |
          set -euo pipefail
          FILE="state/m5_research/execution/m5-v04-20261013-14d/risk/v041_entry_robustness.json"
          if [ -f "$FILE" ]; then
            echo "Existing V0.4.1 report sealed; do not overwrite"
          else
            python -m m5_research.v041_robustness
          fi
      - name: Persist immutable V0.4.1 report and event audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "state/m5_research/execution/m5-v04-20261013-14d/risk/v041_entry_robustness.json" \
                  "state/m5_research/execution/m5-v04-20261013-14d/risk/v041_event_sensitivity.jsonl.gz"
          if git diff --cached --quiet; then
            echo "No new V0.4.1 report changes"
          else
            git commit -m "research(m5): file V0.4.1 exploratory entry and outlier audit [skip ci]"
            saved=false
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                saved=true
                break
              fi
            done
            if [ "$saved" != true ]; then
              echo "M5 V0.4.1 report NOT persisted" >&2
              exit 1
            fi
          fi
      - name: Note limitations
        if: always()
        run: |
          echo "## M5 V0.4.1 historical sensitivity (NO live strategy)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Same frozen 48 previously inspected V0.4 events; NOT OOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fixed EVENT-relative exit clocks: delayed entry holds 15m less" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fees 5bps/side and adverse slippage grid 0/5/10/20bps/side are hypothetical" >> "$GITHUB_STEP_SUMMARY"
          echo "- No exchange orders, funding, spread data, tick sequencing or forward validation" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M5-V041-Exploratory-Entry-Robustness-${{ github.run_id }}
          path: |
            state/m5_research/execution/m5-v04-20261013-14d/risk/v041_entry_robustness.json
            state/m5_research/execution/m5-v04-20261013-14d/risk/v041_event_sensitivity.jsonl.gz
          if-no-files-found: warn
          retention-days: 30
